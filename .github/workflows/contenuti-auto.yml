name: Contenuti automatici
# Per la sessione programmata dei contenuti: se una pull request cambia SOLO
# content/*.json e docs/CONTENUTI.md e i test passano, viene unita da sola.
# Ogni modifica al codice (anche un solo file fuori da quell'elenco) richiede sempre una persona.
# Niente pull_request_target: il codice della PR gira solo con permessi della PR stessa.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  fusione:
    # Solo PR dallo stesso repository (mai da fork).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Controlla che cambino solo i contenuti
        id: ambito
        run: |
          git diff --name-only --no-renames "origin/${{ github.base_ref }}...HEAD" > cambiati.txt
          cat cambiati.txt
          if node scripts/solo-contenuti.mjs < cambiati.txt; then
            echo "solo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Modifiche fuori dai contenuti: serve una persona."
            echo "solo=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unisci e pubblica
        if: steps.ambito.outputs.solo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
          # Il merge fatto con GITHUB_TOKEN non avvia pages.yml: lo lanciamo a mano.
          gh workflow run pages.yml --ref main
