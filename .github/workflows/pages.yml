name: Pubblica
# Un evento creato con GITHUB_TOKEN (es. un merge automatico) non avvia altri workflow:
# per questo c'è workflow_dispatch, da lanciare con `gh workflow run pages.yml --ref main`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa Piper e ffmpeg
        run: |
          pip install piper-tts==1.8.0
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Cache della voce
        id: voce-cache
        uses: actions/cache@v4
        with:
          path: voci
          key: piper-voce-en_US-ljspeech-high
      - name: Scarica la voce
        if: steps.voce-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p voci
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ljspeech/high
          curl -fsSL -o voci/en_US-ljspeech-high.onnx "$BASE/en_US-ljspeech-high.onnx"
          curl -fsSL -o voci/en_US-ljspeech-high.onnx.json "$BASE/en_US-ljspeech-high.onnx.json"
      - name: Prepara il sito
        run: |
          SITE_FILES="index.html styles.css manifest.webmanifest sw.js src content icons"
          mkdir _site
          cp -r $SITE_FILES _site/
          sed -i "s/__VERSIONE__/${GITHUB_SHA::12}/" _site/sw.js
          python3 scripts/genera_audio.py _site/audio voci/en_US-ljspeech-high.onnx
          if grep -rq "__VERSIONE__" _site; then
            echo "Segnaposto __VERSIONE__ ancora presente in _site" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
