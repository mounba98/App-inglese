<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imparo l'inglese</title>
  <meta name="theme-color" content="#1f5f8b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"><p class="msg">Caricamento…</p></main>
  <script type="module" src="src/app.js"></script>
  <script>
    // Rete di sicurezza: se l'app non parte, niente «Caricamento…» infinito.
    // app.js imposta data-pronta sul body appena ha disegnato qualcosa.
    (function () {
      function fallisci() {
        if (document.body.hasAttribute('data-pronta')) return;
        var m = document.querySelector('#app .msg');
        if (m) m.textContent = "Non riesco ad avviare l'app. Chiudila e riaprila.";
      }
      window.addEventListener('error', fallisci);
      setTimeout(fallisci, 8000);
    })();
  </script>
  <script>
    // Uso offline: solo in contesto sicuro (https o localhost); un errore non rompe l'app.
    if ('serviceWorker' in navigator && (window.isSecureContext || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) { /* ignora */ }
      });
      // App rimasta aperta: al ritorno in primo piano cerca una versione nuova (al massimo una volta l'ora).
      let ultimoControllo = Date.now();
      document.addEventListener('visibilitychange', () => {
        try {
          if (document.visibilityState !== 'visible') return;
          if (Date.now() - ultimoControllo < 60 * 60 * 1000) return;
          ultimoControllo = Date.now();
          navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
        } catch (e) { /* ignora */ }
      });
    }
  </script>
</body>
</html>
